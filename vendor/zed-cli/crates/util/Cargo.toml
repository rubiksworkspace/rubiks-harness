# Generated by scripts/vendor_zed_cli.py; see ../../README.md.
[package]
name = "zed-util"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "The parts of Zed's util crate that Zed's CLI uses."

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lib]
name = "util"
path = "src/util.rs"
doctest = false

[features]
test-support = ["dep:tempfile", "dep:serde_json"]

[dependencies]
dirs = "6.0"
regex = "1.5"
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"], optional = true }
tempfile = { version = "3.20.0", optional = true }
util_macros = { package = "zed-util-macros", path = "../util_macros" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["user"] }

[target.'cfg(target_os = "windows")'.dependencies]
dunce = "1.0"
